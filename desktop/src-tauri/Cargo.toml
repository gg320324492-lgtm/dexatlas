[package]
name = "dexatlas-desktop"
version = "1.2.0"
description = "DexAtlas 桌面应用（Tauri 2）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dexatlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
