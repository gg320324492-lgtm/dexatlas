[package]
name = "dexatlas-desktop"
version = "0.1.0"
description = "DexAtlas 桌面应用（Tauri 2）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-http：启用 Tauri 的 HTTP 能力（capabilities/default.json 里的 http:default），
# 供前端经 Tauri 的 fetch 访问本地 FastAPI 后端 http://localhost:8618。
tauri = { version = "2", features = ["protocol-http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
