[project]
name = "dexatlas"
# The version lives in src/dexatlas/__init__.py and is read from there — see
# [tool.hatch.version] below. Writing it in both places let the published packages
# claim a version they were not.
dynamic = ["version"]
description = "Evidence-first, AI-ready Android reverse engineering and analysis platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "DexAtlas contributors" }]
keywords = [
    "android",
    "reverse-engineering",
    "apk-analysis",
    "static-analysis",
    "jadx",
    "apktool",
    "androguard",
    "mobile-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

# Runtime dependencies stay deliberately small. JADX, Apktool, Androguard and Ghidra
# are invoked as external processes, never vendored — see docs/roadmap/ROADMAP.md.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    # Required by FastAPI for the /analyze multipart upload.
    "python-multipart>=0.0.12",
    # AndroidManifest.xml comes from an untrusted APK. defusedxml refuses entity
    # declarations, DTDs and external references, which a plain parser does not.
    "defusedxml>=0.7",
    # Apktool relocates versionCode / versionName / SDK levels out of the manifest and
    # into its apktool.yml build file, so the manifest reader needs to parse YAML.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = [
    "androguard>=4.1",
]
demo = [
    # scripts/render-demo.py draws each frame with Pillow and encodes with ffmpeg.
    "pillow>=10.0",
]
mcp = [
    # The Model Context Protocol SDK, for the read-only MCP server. It is an
    # extra rather than a dependency: the analysis core does not need it, and a
    # deployment that exposes the analyzer over REST does not either.
    "mcp>=1.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-defusedxml>=0.7",
    "types-pyyaml>=6.0",
    # Dead-code detection. Ruff has no rule for a defined-but-never-called
    # function (F401 covers imports only), so the gate against them is
    # vulture's exit code; see the [tool.vulture] section below.
    "vulture>=2.14",
]

[tool.vulture]
# Both trees are scanned together: a symbol used only by tests (Analyzer.class_source,
# Store.get_class) is alive, and scanning src/ alone would report it. With both,
# the pytest machinery names are what need ignoring.
paths = ["src", "tests", "scripts", "benchmarks"]
min_confidence = 80
# Decorators that register code with a framework, so a definition vulture sees
# as unreferenced is in fact reachable: FastAPI routes, Typer commands,
# pydantic validators, pytest fixtures and marks, and plain properties.
ignore_decorators = [
    "@app.get",
    "@app.post",
    "@app.delete",
    "@app.put",
    "@app.patch",
    "@app.callback",
    "@app.command",
    "@field_validator",
    "@model_validator",
    "@pytest.fixture",
    "@pytest.mark.*",
    "@typer.*",
]
# Names that are read by a mechanism rather than by our code: pydantic's
# config, sqlite3's row_factory, pytest's module-level markers, and test
# fixtures' well-known names. The last five are test doubles' parameters:
# a stub keeps an argument to match the signature it replaces
# (sig, sha), and a test keeps a fixture argument so pytest injects it
# (the three fixture names) — none of them is a dead definition.
ignore_names = [
    "model_config",
    "row_factory",
    "pytestmark",
    "apktool_available",
    "jadx_unavailable",
    "fake_dex",
    "compress_type",
    "_blob",
    "report_path",
    "sig",
    "sha",
    "launcher_dies_before_the_kill",
    "the_kill_cannot_find_the_tree",
    "the_kill_itself_fails",
]

[project.scripts]
dexatlas = "dexatlas.cli.main:app"
# The read-only MCP server. It speaks over stdio, so a host starts it as a
# subprocess; see docs/architecture/mcp-server.md.
dexatlas-mcp = "dexatlas.mcp.server:main"
# The M4 web workbench: a browser over the same ten read-only tools, called
# in-process; see docs/architecture/workbench.md.
dexatlas-workbench = "dexatlas.workbench.__main__:main"

[project.urls]
Homepage = "https://github.com/gg320324492-lgtm/dexatlas"
Repository = "https://github.com/gg320324492-lgtm/dexatlas"
Issues = "https://github.com/gg320324492-lgtm/dexatlas/issues"
Roadmap = "https://github.com/gg320324492-lgtm/dexatlas/blob/main/docs/roadmap/ROADMAP.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dexatlas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dexatlas"]
# The workbench's front-end sources travel with the package so a wheel can
# build them on first start. npm's install tree and the built bundle are
# regenerable and must not travel with it.
exclude = [
  "src/dexatlas/workbench/web/node_modules/",
  "src/dexatlas/workbench/web/dist/",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.scratch/",
  "/.claude/",
  "src/dexatlas/workbench/web/node_modules/",
  "src/dexatlas/workbench/web/dist/",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src/dexatlas"]
strict = true
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
# Androguard depends on loguru; it ships no type information.
module = ["androguard.*", "loguru.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that invoke real external analysis backends",
]
