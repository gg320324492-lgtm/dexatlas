[project]
name = "dexatlas"
version = "0.1.0"
description = "Evidence-first, AI-ready Android reverse engineering and analysis platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "DexAtlas contributors" }]
keywords = [
    "android",
    "reverse-engineering",
    "apk-analysis",
    "static-analysis",
    "jadx",
    "apktool",
    "androguard",
    "mobile-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

# Runtime dependencies stay deliberately small. JADX, Apktool, Androguard and Ghidra
# are invoked as external processes, never vendored — see docs/roadmap/ROADMAP.md.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    # Required by FastAPI for the /analyze multipart upload.
    "python-multipart>=0.0.12",
    # AndroidManifest.xml comes from an untrusted APK. defusedxml refuses entity
    # declarations, DTDs and external references, which a plain parser does not.
    "defusedxml>=0.7",
    # Apktool relocates versionCode / versionName / SDK levels out of the manifest and
    # into its apktool.yml build file, so the manifest reader needs to parse YAML.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = [
    "androguard>=4.1",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-defusedxml>=0.7",
    "types-pyyaml>=6.0",
]

[project.scripts]
dexatlas = "dexatlas.cli.main:app"

[project.urls]
Homepage = "https://github.com/gg320324492-lgtm/dexatlas"
Repository = "https://github.com/gg320324492-lgtm/dexatlas"
Issues = "https://github.com/gg320324492-lgtm/dexatlas/issues"
Roadmap = "https://github.com/gg320324492-lgtm/dexatlas/blob/main/docs/roadmap/ROADMAP.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dexatlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src/dexatlas"]
strict = true
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
# Androguard depends on loguru; it ships no type information.
module = ["androguard.*", "loguru.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that invoke real external analysis backends",
]
