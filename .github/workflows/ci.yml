name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      # The whole history and the tags. The version-claim check below reads
      # the tag list to learn what has been released, and compares the
      # documents with another commit; a shallow checkout has neither, and a
      # checker that found no tags would report nothing and pass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      # actionlint checks the workflow files themselves. Without it, a mistake in
      # this file makes GitHub refuse to schedule a single job — which shows up as
      # a run that fails with no output and no jobs, and takes a while to tell
      # apart from a platform problem.
      - name: Workflow lint
        uses: rhysd/actionlint@v1.7.12
      # The documents say which versions have been released, and a version is
      # not a line number: check-doc-citations.py cannot see a release claim
      # that has gone stale. This check reads the facts out of the repository
      # — the tags, the package version, the changelog — and reports the
      # claims that contradict them.
      #
      # Only the claims this commit *adds* are failures. The ones the base
      # commit already had are drift that is on its way out, and a check that
      # went red over them would be ignored. "Already fixed" is a fact about
      # the repository: once the fix lands, the base no longer has the finding
      # and the finding stops being reported, with no list of exceptions
      # anywhere.
      - name: Version claims
        env:
          # The commit the push started from, so a push of several commits is
          # compared as a whole. A pull request does not use it: see below.
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # A pull request's "before" is the head the branch had before
            # the last push -- measured on Actions, on a synchronize event
            # it is that head and not the point the branch left the
            # mainline at. A claim an earlier push introduced is in that
            # head already, so the check would call it drift that is on its
            # way out and pass. The merge base with the mainline is what a
            # pull request wants: every claim the branch introduced is a
            # claim it added, however many times it has been pushed.
            uv run python scripts/check-version-claims.py --base auto
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            uv run python scripts/check-version-claims.py --base "$BEFORE"
          else
            uv run python scripts/check-version-claims.py --base auto
          fi

  test:
    # The 3.12 job also runs the default configuration end to end — a
    # relative workspace, outside the repository — because that is the
    # configuration every test in the suite had been avoiding.
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-claim check reads the tag list to learn what has been
          # released, and the test that exercises it runs against this clone.
          # A shallow checkout has no tags, and a check that found no tags
          # would refuse to answer -- correctly. Fetch them.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra analysis --extra mcp --frozen

      - name: Fetch test fixtures
        env:
          # The script uses the gh API, which needs a token even for public content.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-fixtures.sh

      # The full suite, slow tests included, is what the coverage gate measures.
      # Running only the fast tests leaves the JADX and Apktool adapters untested and
      # drops coverage from 82% to 70%, which would make the threshold below a fiction.
      # 3.13 runs without the external backends — no Java, so no JADX and no Apktool.
      # Androguard is a Python package and the `analysis` extra installs it, so it is
      # still there; saying "no backends" would be false.
      # The third configuration — Apktool present, JADX absent — has its own job below.
      - uses: actions/setup-java@v4
        if: matrix.python-version == '3.12'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install analysis backends
        if: matrix.python-version == '3.12'
        run: bash scripts/install-backends.sh

      - name: Run tests
        run: uv run pytest --cov=dexatlas --cov-report=xml --cov-report=term

      - name: Enforce coverage threshold
        run: uv run coverage report --fail-under=80

      # The default configuration, run from a directory that is not the
      # repository.
      #
      # Every test in this suite uses an absolute workspace, so the default --
      # a relative one -- was never exercised. That is how the default lost
      # its Java decompilation for a whole release: the path was handed to
      # JADX twice, resolved against two different bases, and the sources
      # landed in a nested copy of the tree the index reads. The report
      # credited jadx 1.5.2 and recorded nothing from it.
      #
      # The unit tests pin that now, but they use a stand-in for the command
      # line. This step runs the real thing, in the configuration a reader
      # gets when they follow the quick start: a relative workspace, outside
      # the repository, and a report that has to say the decompiler worked.
      - name: The default configuration decompiles
        if: matrix.python-version == '3.12'
        run: |
          cd "$RUNNER_TEMP"
          uv run --project "$GITHUB_WORKSPACE" --no-sync dexatlas analyze \
            "$GITHUB_WORKSPACE/examples/demo-app/demo.apk" --output report.md
          # The row is the claim: the report has to say that JADX turned
          # methods into Java. Its absence is what the broken default looked
          # like from the outside.
          grep -q "Methods decompiled by JADX" report.md

  test-partial-backends:
    name: Tests (Apktool only, no JADX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-claim check reads the tag list to learn what has been
          # released, and the test that exercises it runs against this clone.
          # A shallow checkout has no tags, and a check that found no tags
          # would refuse to answer -- correctly. Fetch them.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra analysis --extra mcp --frozen

      - name: Fetch test fixtures
        env:
          # The script uses the gh API, which needs a token even for public content.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-fixtures.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Only Apktool is installed: this job exists to test the configuration where
      # the decompiler is absent, and downloading 100 MB of JADX in order to delete
      # it again would be a slow way of saying "not installed". The version pins
      # still live in the one script, so they cannot drift from the other jobs.
      - name: Install analysis backends
        env:
          BACKENDS: apktool
        run: bash scripts/install-backends.sh

      # "JADX is not installed" has to be true in every sense, and the job checks
      # that before it trusts its own name. The install script puts nothing on PATH
      # for a backend it did not install, and an empty value disables the backend
      # outright, with no PATH lookup and no "stale pin" fallback.
      #
      # This configuration is the one the Smali fallback exists for: Apktool is
      # there, the code is still readable, and the decompiler is not. The other
      # two jobs have every backend and no backend at all, and neither of them
      # is this one — which is how two tests that assumed JADX were installed
      # stayed green in CI for as long as they did.
      - name: Run tests without JADX
        run: |
          export DEXATLAS_JADX_PATH=""
          if command -v jadx >/dev/null 2>&1; then
            echo "jadx is on PATH; this job would test the wrong configuration" >&2
            exit 1
          fi
          # The tool's own view is the one that counts: the configuration under
          # test is what DexAtlas sees, not what the shell happens to find.
          DEXATLAS_WORKSPACE="${RUNNER_TEMP}/dexatlas-check" uv run dexatlas backends \
            | grep -qE 'jadx.*not installed' || {
              echo "DexAtlas still reports jadx as available" >&2
              exit 1
            }
          uv run pytest --cov=dexatlas --cov-report=xml --cov-report=term

      # The same gate as the other jobs, and it is a real one here: this
      # configuration measures above 90%, with the decompiler's own subprocess
      # code being the part it cannot reach. The three jobs therefore measure
      # the same thing under three different conditions, rather than one of
      # them measuring nothing at all.
      - name: Enforce coverage threshold
        run: uv run coverage report --fail-under=80

  m3-comparison:
    name: M3 comparison stays reproducible
    runs-on: ubuntu-latest
    # A two-question smoke run does not need the Java tools: Androguard comes
    # from the `analysis` extra, and a missing JADX/Apktool is a recorded
    # ToolError rather than an exception. Disabling both paths keeps this job
    # independent of backend downloads, JDKs and version pins; the test jobs
    # above already cover the configurations where those tools are installed.
    env:
      # An empty pin disables PATH discovery outright, so a leftover jadx on a
      # runner cannot make this backend-free configuration a different one.
      DEXATLAS_JADX_PATH: ""
      DEXATLAS_APKTOOL_JAR: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Keep the uv-run processes' temporary files and every harness artifact
      # beside the workspace, as tests/conftest.py does for the test suite.
      - name: Keep generated files in .scratch
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.scratch/tmp"
          {
            echo "TMPDIR=$GITHUB_WORKSPACE/.scratch/tmp"
            echo "TEMP=$GITHUB_WORKSPACE/.scratch/tmp"
            echo "TMP=$GITHUB_WORKSPACE/.scratch/tmp"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --extra dev --extra analysis --extra mcp --frozen

      # Gate one: the published table is the CLI's recomputed metrics, not a
      # set of numbers someone typed. Parse the report's eight rows so a change
      # to one formula cannot pass just because another figure still appears.
      - name: Recompute the published figures
        run: |
          set -euo pipefail
          uv run --no-sync python benchmarks/comparison/run.py \
            --input docs/benchmarks/comparison-traces.json --metrics \
            > .scratch/comparison-metrics.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          from benchmarks.comparison.metrics import METRIC_NAMES, format_value

          metrics = json.loads(
              Path(".scratch/comparison-metrics.json").read_text(encoding="utf-8")
          )
          report = Path("docs/benchmarks/comparison.md").read_text(encoding="utf-8")
          systems = ("A", "B", "DexAtlas")
          assert set(metrics) == set(systems), sorted(metrics)
          header: list[str] = []
          rows: dict[str, list[str]] = {}
          for line in report.splitlines():
              cells = [cell.strip() for cell in line.strip().strip("|").split("|")]
              if cells == ["Metric", *systems]:
                  header = cells[1:]
              if len(cells) == 4 and cells[0].startswith("`") and cells[0].endswith("`"):
                  rows[cells[0].strip("`")] = cells[1:]
          assert header == list(systems), header
          assert tuple(rows) == METRIC_NAMES, tuple(rows)
          for metric in METRIC_NAMES:
              expected = [format_value(metric, metrics[name][metric]) for name in systems]
              assert rows[metric] == expected, (metric, rows[metric], expected)
          print("the eight published metric rows match the committed trace")
          PY

      # A regenerated report has to be identical to the checked-in one, and
      # the suite's own regression test states the same contract. Without both,
      # a hand-edited report or a trace/report pair that drifted apart could
      # survive a green metrics command. read_text normalises the platform's
      # line endings; Windows writes CRLF, while the checkout and Linux CI use LF.
      - name: The published report regenerates from the committed traces
        run: |
          set -euo pipefail
          uv run --no-sync python benchmarks/comparison/run.py \
            --input docs/benchmarks/comparison-traces.json \
            --report .scratch/comparison.md
          uv run --no-sync python - <<'PY'
          import difflib
          from pathlib import Path

          published = Path("docs/benchmarks/comparison.md").read_text(encoding="utf-8")
          generated = Path(".scratch/comparison.md").read_text(encoding="utf-8")
          if published != generated:
              print("".join(difflib.unified_diff(
                  published.splitlines(keepends=True),
                  generated.splitlines(keepends=True),
                  fromfile="published",
                  tofile="regenerated",
              )))
              raise SystemExit("the published report does not regenerate exactly")
          print("the published report regenerates from the committed trace")
          PY
          uv run --no-sync pytest -q \
            tests/test_comparison_metrics.py::test_committed_traces_regenerate_the_published_report

      # Gate two: the harness still runs end to end. An exit code of 0 is not
      # enough -- a smoke run that silently drops one configuration would
      # otherwise pass, so count the traces for each of A, B and DexAtlas.
      - name: Smoke-test the three configurations
        run: |
          set -euo pipefail
          uv run --no-sync python benchmarks/comparison/run.py \
            --limit 2 --output .scratch/comparison-smoke
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          output = Path(".scratch/comparison-smoke")
          document = json.loads((output / "comparison.json").read_text(encoding="utf-8"))
          traces = json.loads((output / "traces.json").read_text(encoding="utf-8"))["traces"]
          systems = ("A", "B", "DexAtlas")
          assert document["kind"] == "m3_comparison", document["kind"]
          assert document["task_count"] == 2, document["task_count"]
          assert document["traces"] == traces, "comparison.json and traces.json disagree"
          assert len(traces) == 6, len(traces)
          assert {trace["system"] for trace in traces} == set(systems)
          for system in systems:
              references = sorted(
                  trace["reference"] for trace in traces if trace["system"] == system
              )
              assert references == ["q001", "q002"], (system, references)
          failed = sorted(
              (trace["system"], trace["reference"], trace["result"]["error"])
              for trace in traces
              if trace["result"]["failed"] or trace["result"]["error"]
          )
          assert not failed, failed
          print("two questions x three configurations: six usable traces")
          PY

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dexatlas:ci .
      - name: Verify the backends in the image actually run
        run: docker run --rm dexatlas:ci dexatlas backends

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra analysis --extra mcp --frozen
      - name: Export the resolved dependency set
        run: uv export --format requirements-txt --no-hashes --no-emit-project -o requirements.txt
      - name: Audit for known vulnerabilities
        run: uv run --with pip-audit pip-audit -r requirements.txt --strict
      - name: Upload the audited requirement set
        uses: actions/upload-artifact@v4
        with:
          name: audited-requirements
          path: requirements.txt
          retention-days: 30
