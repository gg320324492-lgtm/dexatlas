# TEMPORARY: 查清 tag 上的测量 job 为什么在自检轮量不出东西。
#
# 这个 workflow 不在 ci.yml 里，是因为 ci.yml 里的 job 数被
# tests/test_platform_independent_gates.py::test_every_ci_job_redirects_its_temporary_directory
# 数着（9 个重定向临时目录的 job、11 处 uv sync）—— 多一个 job，那条测试就红，
# 而它一红，套件就红，测量脚本就会在代码轮失败后提前返回（那正是它该做的）。
#
# 它 checkout 的是 **tag 那棵树**（v1.0.0），不是 main：main 上的报告数字已经过期，
# 套件里有几条断言会红，测量脚本同样会在代码轮就返回 —— 到不了出问题的自检轮。
# tag 那棵树上报告与树一致，套件是绿的，脚本才会走到自检轮 —— 那里才有答案。
name: Diagnose

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    name: The tag tree's own measurement flow, subprocess by subprocess
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0
          # The measurement reads the tags and the history: a shallow
          # checkout has neither.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Keep generated files in .scratch
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.scratch/tmp"
          {
            echo "TMPDIR=$GITHUB_WORKSPACE/.scratch/tmp"
            echo "TEMP=$GITHUB_WORKSPACE/.scratch/tmp"
            echo "TMP=$GITHUB_WORKSPACE/.scratch/tmp"
          } >> "$GITHUB_ENV"
      - name: Install dependencies
        run: uv sync --extra dev --extra analysis --extra demo --extra mcp --frozen
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install analysis backends
        run: bash scripts/install-backends.sh
      - name: Fetch test fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-fixtures.sh
      # The script runs its own flow; a spy on ``run`` prints every subprocess
      # it starts: the command, the exit code, the environment that matters and
      # the tail of what it said. The round that measured nothing shows up as a
      # subprocess with no summary line.
      - name: The script's own flow, subprocess by subprocess
        run: |
          set -uo pipefail
          uv run --no-sync python - <<'PY'
          import importlib.util
          import sys

          spec = importlib.util.spec_from_file_location(
              "rf", "scripts/refresh-report-figures.py"
          )
          rf = importlib.util.module_from_spec(spec)
          sys.modules["rf"] = rf
          spec.loader.exec_module(rf)

          original = rf.run
          index = 0

          def spy(*args, env=None):
              global index
              index += 1
              result = original(*args, env=env)
              print(f"### subprocess {index}: {' '.join(args[:8])}")
              print(f"### exit code: {result.returncode}")
              print(f"### env COVERAGE_FILE={env.get('COVERAGE_FILE') if env else None}")
              print(f"### env COVERAGE_PROCESS_START={env.get('COVERAGE_PROCESS_START') if env else None}")
              print(f"### env DEXATLAS_REPORT_PATH={env.get('DEXATLAS_REPORT_PATH') if env else None}")
              print("### stdout tail:")
              print("\n".join(result.stdout.splitlines()[-40:]))
              print("### stderr tail:")
              print("\n".join(result.stderr.splitlines()[-10:]))
              return result

          rf.run = spy
          code = rf.main(["--check"])
          print("### script exit:", code)
          PY
