version: "2"

services:
  dexatlas:
    build:
      context: .
    image: dexatlas:latest
    ports:
      # Bound to the loopback interface on purpose. The API has no
      # authentication — it lists every project and serves their sources — so
      # publishing it on every interface would publish the analysis to the
      # network. Put a reverse proxy with authentication in front of it to
      # expose it; see docs/install.md.
      - "127.0.0.1:8000:8000"
    volumes:
      - dexatlas-workspace:/workspace
    environment:
      # Analysis backends are auto-detected in the image. Override to point at your own
      # installs, or set DEXATLAS_JADX_PATH="" to run without external engines.
      DEXATLAS_WORKSPACE: /workspace
      DEXATLAS_LOG_LEVEL: INFO
    restart: unless-stopped

volumes:
  dexatlas-workspace:
